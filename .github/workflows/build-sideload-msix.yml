name: Build Sideload MSIX

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-msix:
    runs-on: windows-2022

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore NuGet packages
        shell: powershell
        run: |
          dotnet restore src/Wino.Mail.WinUI/Wino.Mail.WinUI.csproj --configfile nuget.config
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet restore failed"
          }

      - name: Build unsigned MSIX bundle
        shell: powershell
        run: |
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null

          [xml]$manifest = Get-Content -LiteralPath "src/Wino.Mail.WinUI/Package.appxmanifest" -Raw
          $version = [string]$manifest.Package.Identity.Version
          Write-Host "Building Wino Mail version: $version" -ForegroundColor Green

          dotnet build src/Wino.Mail.WinUI/Wino.Mail.WinUI.csproj `
            -c Release `
            -p:Platform=x64 `
            -p:RuntimeIdentifier=win-x64 `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxBundle=Always `
            -p:AppxBundlePlatforms=x64 `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:AppxPackageSigningEnabled=false `
            -p:GenerateTemporaryStoreCertificate=false `
            -p:GenerateAppInstallerFile=false `
            -p:AppxSymbolPackageEnabled=false `
            -p:AppxPackageDir=$artifactRoot `
            -v:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "MSIX build failed"
          }

          Write-Host "Artifacts created under: $artifactRoot" -ForegroundColor Green
          Get-ChildItem -Path $artifactRoot -Recurse | Select-Object FullName, Length

      - name: Find built MSIX bundle
        id: find_bundle
        shell: powershell
        run: |
          $bundle = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter *.msixbundle -Recurse -File -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $bundle) {
            Write-Error "No .msixbundle file was found under $env:GITHUB_WORKSPACE"
            exit 1
          }

          Write-Host "Found bundle: $($bundle.FullName)"
          "bundle=$($bundle.FullName)" >> $env:GITHUB_OUTPUT
          "filename=$($bundle.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinoMail-msix
          path: ${{ steps.find_bundle.outputs.bundle }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_bundle.outputs.bundle }}
          draft: false
          prerelease: false
          body: |
            ## Wino Mail Sideload Package

            This is an unsigned sideload build for local installation. **Windows may show security warnings during installation.** 

            ### Installation

            1. Download the `.msixbundle` file below
            2. Open PowerShell as Administrator
            3. Run the following command:
               ```powershell
               Add-AppxPackage -Path ".\${{ steps.find_bundle.outputs.filename }}"
               ```
            4. Launch **Wino Mail** from your Start menu

            ### What is this?

            This build is **not signed** and **not published to the Microsoft Store**. It is for users who want to run the latest development version locally.

            To uninstall: Settings → Apps → Apps & features → Wino Mail (Preview) → Uninstall